# Supabase's free tier pauses a project after 7 days without database activity,
# which silently breaks the cloud backup. This makes one tiny read every 3 days.
# It uses only the publishable anon key already shipped in cvsender/cloud.py and
# reads nothing: with no owner secret, row-level security returns zero rows.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Touch the database
        env:
          URL: https://ntvuxtvepmqzdcxphurj.supabase.co
        run: |
          ANON=$(curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/cvsender/cloud.py" \
            | tr -d '\n' | grep -o 'DEFAULT_ANON = ([^)]*)' | grep -o '"[^"]*"' | tr -d '" ')
          code=$(curl -s --retry 3 -o /dev/null -w '%{http_code}' \
            -H "apikey: $ANON" -H "Authorization: Bearer $ANON" \
            "$URL/rest/v1/app_settings?select=key&limit=1")
          echo "HTTP $code"
          test "$code" = "200"
