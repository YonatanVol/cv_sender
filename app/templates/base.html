<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CV Sender</title>
  <style>
    :root { --bg:#0f1115; --card:#1a1d24; --line:#2a2f3a; --fg:#e7e9ee;
            --mut:#9aa3b2; --acc:#4f8cff; --ok:#2ecc71; --warn:#f1c40f;
            --bad:#e74c3c; }
    * { box-sizing:border-box; }
    body { margin:0; font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;
           background:var(--bg); color:var(--fg); }
    header { display:flex; gap:18px; align-items:center; padding:14px 22px;
             border-bottom:1px solid var(--line); background:var(--card); }
    header a { color:var(--fg); text-decoration:none; font-weight:600; }
    header a.brand { color:var(--acc); margin-right:auto; }
    main { max-width:920px; margin:24px auto; padding:0 18px; }
    .card { background:var(--card); border:1px solid var(--line);
            border-radius:12px; padding:18px 20px; margin-bottom:18px; }
    h1 { font-size:20px; margin:0 0 4px; } h2 { font-size:16px; margin:0 0 12px; }
    label { display:block; margin:10px 0 4px; color:var(--mut); font-size:13px; }
    input[type=text], input[type=email], input[type=number], select {
      width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--line);
      background:#11141a; color:var(--fg); }
    .row { display:flex; gap:14px; } .row > div { flex:1; }
    .check { display:flex; align-items:center; gap:8px; color:var(--fg); margin:8px 0; }
    .check input { width:auto; }
    button { background:var(--acc); color:#fff; border:0; border-radius:9px;
             padding:11px 20px; font-size:15px; font-weight:600; cursor:pointer; }
    button.big { font-size:18px; padding:14px 30px; width:100%; }
    button[disabled] { opacity:.5; cursor:not-allowed; }
    .muted { color:var(--mut); } .pill { padding:2px 9px; border-radius:20px;
             font-size:12px; font-weight:600; }
    .applied { background:rgba(46,204,113,.15); color:var(--ok); }
    .needs_review,.filled { background:rgba(241,196,15,.15); color:var(--warn); }
    .failed { background:rgba(231,76,60,.15); color:var(--bad); }
    table { width:100%; border-collapse:collapse; }
    th,td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line);
            font-size:13px; vertical-align:top; }
    a.link { color:var(--acc); }
    .banner { padding:10px 14px; border-radius:8px; background:rgba(79,140,255,.12);
              border:1px solid rgba(79,140,255,.3); margin-bottom:14px; }
    .warn-banner { background:rgba(241,196,15,.1); border-color:rgba(241,196,15,.35); }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">⚡ CV Sender</a>
    <a href="/">Dashboard</a>
    <a href="/profile">Profile</a>
    <a href="/results">Results</a>
    <a href="/tracker">Tracker</a>
  </header>
  <main>
    {% block body %}{% endblock %}
  </main>
</body>
</html>
