<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Answers — CV Sender</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="stylesheet" href="/static/shared.css">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  body { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
  .q + .q { margin-top: 12px; }
  .qh { display: flex; gap: 11px; align-items: flex-start; margin-bottom: 12px; }
  .label { font-weight: 600; line-height: 1.4; }
  .eg { color: var(--dim); font-size: 12px; margin-top: 4px; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    display: flex; gap: 12px; align-items: center;
    padding: 12px max(16px, env(safe-area-inset-left))
             calc(12px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: saturate(140%) blur(14px);
    border-top: 1px solid var(--line);
  }
  .bar span { color: var(--mut); font-size: 13px; flex: 1; }
  .lede { margin-bottom: 14px; }
  .lede b { color: var(--fg); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header id="hdr"></header>
<main>
  <section class="card">
    <h2>Screening answers</h2>
    <p class="sub lede" id="lede">Loading…</p>
    <p class="sub">Answer a question once and every application waiting on it is
      retried, now and in future. Nothing here is guessed for you.</p>
  </section>
  <div id="list"><div class="card"><div class="skeleton" style="height:64px"></div></div></div>
</main>
<div class="bar"><span id="count">Nothing answered yet</span>
  <button id="save" disabled>Save &amp; retry</button></div>
<div id="toast" class="toast hide"></div>
<script src="/static/shared.js"></script>
<script>
$('hdr').innerHTML = navBar('/answers');
let gaps = [], answers = {};

function render() {
  if (!gaps.length) {
    $('list').innerHTML = `<section class="card"><div class="empty">
      <h3>Nothing to answer</h3>
      <p class="sub">Every question in your queue has an answer.
         New ones appear here as they come up.</p></div></section>`;
    return;
  }
  $('list').innerHTML = gaps.map((g, i) => {
    // A consent/acknowledgement box has no options of its own; it is still a
    // yes-or-no question, and a free-text box for it is unanswerable.
    let opts = (g.options || []).filter(o => o && !/^select an option$/i.test(o));
    if (!opts.length && g.kind === 'checkbox') opts = ['Yes', 'No'];
    const field = opts.length
      ? `<div class="opts" data-i="${i}">${opts.map(o =>
          `<button class="chip" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`
      : `<input id="in${i}" data-i="${i}" placeholder="Your answer"
           inputmode="${/how many|years|שנות|גיל/i.test(g.label) ? 'numeric' : 'text'}">`;
    return `<section class="card q">
      <div class="qh">
        <span class="pill warn">${g.blocking} job${g.blocking === 1 ? '' : 's'}</span>
        <div><div class="label">${esc(g.label)}</div>
             <div class="eg">asked by ${esc(g.example)}</div></div>
      </div>${field}</section>`;
  }).join('');

  document.querySelectorAll('.opts .chip').forEach(el => el.onclick = () => {
    const wrap = el.parentElement, i = wrap.dataset.i;
    wrap.querySelectorAll('.chip').forEach(o => o.classList.remove('on'));
    el.classList.add('on'); answers[gaps[i].label] = el.dataset.v; sync();
  });
  document.querySelectorAll('input[data-i]').forEach(el => el.oninput = () => {
    const g = gaps[el.dataset.i];
    if (el.value.trim()) answers[g.label] = el.value.trim(); else delete answers[g.label];
    sync();
  });
}

function sync() {
  const n = Object.keys(answers).length;
  const jobs = gaps.filter(g => answers[g.label]).reduce((s, g) => s + g.blocking, 0);
  $('count').textContent = n
    ? `${n} answered · unblocks ${jobs} application${jobs === 1 ? '' : 's'}`
    : 'Nothing answered yet';
  $('save').disabled = !n;
}

async function load() {
  try {
    const d = await api('GET', '/api/answers/gaps');
    gaps = d.gaps || []; answers = {};
    $('lede').innerHTML = gaps.length
      ? `<b>${d.blocked_items}</b> applications are waiting on <b>${gaps.length}</b> questions.`
      : `<b>${d.answered}</b> answers saved. Nothing is waiting on you.`;
    render(); sync();
  } catch (e) { $('lede').textContent = e.message; }
}

$('save').onclick = async () => {
  $('save').disabled = true;
  try {
    const r = await api('POST', '/api/answers/bulk', { answers });
    toast(`Saved ${r.learned} · ${r.requeued} application${r.requeued === 1 ? '' : 's'} will retry`);
    await load();
  } catch (e) { toast(e.message); $('save').disabled = false; }
};
load();
</script>
</body>
</html>
