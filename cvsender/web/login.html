<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in — CV Sender</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#0f1115">
<style>
  :root{--bg:#0f1115;--card:#1a1d24;--line:#2a2f3a;--fg:#e7e9ee;--mut:#9aa3b2;--acc:#4f8cff;--bad:#e74c3c}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;padding:20px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:16px;
       padding:26px 24px;width:100%;max-width:380px}
  h1{font-size:20px;margin:0 0 6px}
  p.sub{color:var(--mut);font-size:13px;margin:0 0 18px}
  label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px}
  input{width:100%;padding:13px 12px;font-size:16px;border-radius:10px;
        border:1px solid var(--line);background:#11141a;color:var(--fg)}
  button{width:100%;margin-top:14px;padding:14px;font-size:16px;font-weight:700;
         border:0;border-radius:11px;background:var(--acc);color:#fff;cursor:pointer}
  .err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}
</style>
</head>
<body>
  <div class="box">
    <h1>⚡ CV Sender</h1>
    <p class="sub">Sign in to review and send applications.</p>
    <label for="p">Passphrase</label>
    <input id="p" type="password" autocomplete="current-password" autofocus>
    <button id="go">Sign in</button>
    <div class="err" id="err"></div>
  </div>
<script>
const $ = id => document.getElementById(id);
async function submit() {
  $('err').textContent = '';
  try {
    const r = await fetch('/api/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ passphrase: $('p').value })
    });
    if (!r.ok) { $('err').textContent = (await r.json()).detail || 'Sign in failed'; return; }
    location.href = '/assist';
  } catch (e) { $('err').textContent = 'Network error'; }
}
$('go').onclick = submit;
$('p').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
</script>
</body>
</html>
