<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sent — CV Sender</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="stylesheet" href="/static/shared.css">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  .funnel { display: grid; grid-template-columns: repeat(auto-fit, minmax(86px, 1fr)); gap: 9px; }
  .tile.on { border-color: color-mix(in srgb, var(--acc) 50%, var(--line)); }
  .tile.on b { color: var(--acc); }
  .app { padding: 14px 0; border-top: 1px solid var(--line-soft); }
  .app:first-child { border-top: 0; padding-top: 2px; }
  .app.due { border-left: 2px solid var(--warn); padding-left: 12px; margin-left: -14px; }
  .app .top { display: flex; gap: 9px; align-items: baseline; flex-wrap: wrap; }
  .app .co { font-weight: 650; }
  .app .ttl { color: var(--mut); font-size: 14px; }
  .app .meta { color: var(--dim); font-size: 12px; margin-top: 4px; }
  .stages { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .stages .chip { padding: 6px 12px; min-height: 32px; font-size: 12px; }
  .filters { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
</style>
</head>
<body>
<header id="hdr"></header>
<main>
  <section class="card">
    <h2>The funnel</h2>
    <div class="funnel" id="funnel"></div>
    <p class="sub" style="margin-top:12px">Only you see the replies, so only you move an
      application along. Nothing here is guessed.</p>
  </section>

  <section class="card">
    <div class="filters" id="filters"></div>
    <div id="list"><div class="skeleton" style="height:56px"></div></div>
  </section>
</main>
<div id="toast" class="toast hide"></div>
<script src="/static/shared.js"></script>
<script>
$('hdr').innerHTML = navBar('/applications');
let data = null, filter = '';

const LABEL = {applied: 'Applied', replied: 'Replied', screen: 'Screen',
               interview: 'Interview', offer: 'Offer', rejected: 'Rejected',
               withdrawn: 'Withdrawn', closed: 'Closed'};

function appRow(a) {
  const stages = data.stages.map(s =>
    `<button class="chip${a.stage === s ? ' on' : ''}" data-id="${a.id}" data-stage="${s}"
     >${LABEL[s] || s}</button>`).join('');
  const sent = new Date((a.sent_at || 0) * 1000).toLocaleDateString();
  return `<div class="app${a.followup_due ? ' due' : ''}">
    <div class="top"><span class="co">${esc(a.company)}</span>
      <span class="ttl">${esc(a.title)}</span></div>
    <div class="meta">sent ${esc(sent)} · ${ago(a.days_since_sent)} · ${esc(a.channel)}${
      a.cv_variant ? ' · CV: ' + esc(a.cv_variant) : ''}${
      a.followup_due ? ' · <b style="color:var(--warn)">follow-up due</b>' : ''}</div>
    <div class="stages">${stages}
      ${a.followup_due ? `<button class="chip" data-follow="${a.id}">✓ Followed up</button>
        <button class="chip" data-snooze="${a.id}">Snooze a week</button>` : ''}</div>
  </div>`;
}

function render() {
  $('funnel').innerHTML = Object.entries(data.funnel)
    .map(([s, n]) => `<div class="tile${n ? ' on' : ''}"><b>${n}</b><span>${LABEL[s] || s}</span></div>`)
    .join('');
  const all = Object.keys(data.funnel);
  $('filters').innerHTML = [['', 'All']].concat(all.map(s => [s, LABEL[s] || s]))
    .map(([k, label]) => `<button class="chip${filter === k ? ' on' : ''}" data-f="${k}">${label}</button>`)
    .join('');
  const rows = data.applications.filter(a => !filter || a.stage === filter);
  $('list').innerHTML = rows.length ? rows.map(appRow).join('')
    : `<div class="empty"><h3>Nothing here yet</h3>
         <p class="sub">Applications appear the moment one is confirmed sent.</p></div>`;

  document.querySelectorAll('#filters .chip').forEach(b =>
    b.onclick = () => { filter = b.dataset.f; render(); });
  document.querySelectorAll('.stages .chip[data-stage]').forEach(b =>
    b.onclick = () => move(b.dataset.id, b.dataset.stage));
  document.querySelectorAll('[data-follow]').forEach(b =>
    b.onclick = () => followup(b.dataset.follow, false));
  document.querySelectorAll('[data-snooze]').forEach(b =>
    b.onclick = () => followup(b.dataset.snooze, true));
}

async function move(id, stage) {
  try {
    await api('POST', `/api/applications/${id}/stage`, { stage });
    toast(`Moved to ${LABEL[stage] || stage}`); await load();
  } catch (e) { toast(e.message); }
}
async function followup(id, snooze) {
  try {
    await api('POST', `/api/applications/${id}/followup`, { snooze });
    toast(snooze ? 'Snoozed a week' : 'Follow-up recorded'); await load();
  } catch (e) { toast(e.message); }
}
async function load() {
  try { data = await api('GET', '/api/applications'); render(); }
  catch (e) { $('list').textContent = e.message; }
}
load();
</script>
</body>
</html>
