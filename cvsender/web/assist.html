<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Queue — CV Sender</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="stylesheet" href="/static/shared.css">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  .progress { height: 5px; background: var(--surface-2); border-radius: 5px;
              overflow: hidden; margin-bottom: 14px; }
  .progress i { display: block; height: 100%; background: var(--acc); width: 0;
                transition: width .35s ease; }
  .co { font-size: 19px; font-weight: 750; letter-spacing: -.02em; }
  .role { color: var(--mut); margin-bottom: 10px; }
  img.shot { width: 100%; border-radius: var(--r-sm); border: 1px solid var(--line);
             margin: 12px 0; display: block; }
  .q { margin: 12px 0; }
  .q label { display: block; font-size: 13px; color: var(--mut); margin-bottom: 5px; }
  .actions { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 16px; }
  .actions > * { flex: 1 1 140px; }
  .actions .gone { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, var(--line)); }
  .actions .sent { background: var(--ok); color: #06251a; }
  .kbd { font-size: 11.5px; color: var(--dim); text-align: center; margin-top: 12px; }
  .headrow { display: flex; align-items: flex-start; gap: 14px; }
  .headrow > div { min-width: 0; }
</style>
</head>
<body>
<header id="hdr"></header>
<main>
  <div class="progress"><i id="bar"></i></div>
  <div id="stage"><div class="card"><div class="skeleton" style="height:120px"></div></div></div>
  <div class="kbd">Enter = I sent it · G = not available · S = skip · O = open</div>
</main>
<div id="toast" class="toast hide"></div>
<script src="/static/shared.js"></script>
<script src="/static/assist.js"></script>
</body>
</html>
