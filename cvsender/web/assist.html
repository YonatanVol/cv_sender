<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assist — CV Sender</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root{--bg:#0f1115;--card:#1a1d24;--line:#2a2f3a;--fg:#e7e9ee;--mut:#9aa3b2;
        --acc:#4f8cff;--ok:#2ecc71;--warn:#f1c40f;--bad:#e74c3c}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;
       padding:env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left)}
  header{position:sticky;top:0;z-index:9;background:var(--card);
         border-bottom:1px solid var(--line);padding:12px 16px;
         display:flex;align-items:center;gap:12px}
  .brand{font-weight:700;color:var(--acc)}
  .stat{margin-left:auto;font-size:13px;color:var(--mut)}
  .stat b{color:var(--ok);font-size:17px}
  main{max-width:720px;margin:0 auto;padding:14px}
  .progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:14px}
  .progress i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:16px;margin-bottom:14px}
  .co{font-size:19px;font-weight:700}
  .role{color:var(--mut);margin-bottom:8px}
  .why{display:inline-block;background:rgba(241,196,15,.14);color:var(--warn);
       border-radius:20px;padding:3px 11px;font-size:12px;font-weight:600;margin-bottom:10px}
  .meta{font-size:12px;color:var(--mut);margin:6px 0}
  .ok{color:var(--ok)}
  img.shot{width:100%;border-radius:10px;border:1px solid var(--line);margin:10px 0}
  .q{margin:10px 0}
  .q label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
  .q input{width:100%;padding:11px 12px;font-size:16px;border-radius:9px;
           border:1px solid var(--line);background:#11141a;color:var(--fg)}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  button,a.btn{flex:1;min-width:130px;text-align:center;text-decoration:none;
     padding:14px 16px;font-size:15px;font-weight:700;border:0;border-radius:11px;
     cursor:pointer;background:#11141a;color:var(--fg);border:1px solid var(--line)}
  a.btn.open{background:var(--acc);color:#fff;border-color:var(--acc)}
  button.sent{background:var(--ok);color:#08210f;border-color:var(--ok)}
  button.skip{color:var(--mut)}
  .kbd{font-size:11px;color:var(--mut);text-align:center;margin-top:10px}
  .done{text-align:center;padding:50px 20px;color:var(--mut)}
  .done h2{color:var(--ok)}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;
         background:var(--card);border:1px solid var(--line);border-radius:10px;
         padding:11px 18px;font-size:14px;z-index:20;display:none}
</style>
</head>
<body>
<header>
  <span class="brand">⚡ Assist</span>
  <span class="stat">sent today <b id="sentToday">0</b></span>
</header>
<main>
  <div class="progress"><i id="bar"></i></div>
  <div id="stage"></div>
  <div class="kbd">Enter = I sent it · S = skip · O = open</div>
</main>
<div id="toast" class="toast"></div>
<script src="/static/assist.js"></script>
</body>
</html>
