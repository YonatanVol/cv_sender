<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Settings — CV Sender</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#0f1115">
<style>
  :root{--bg:#0f1115;--card:#1a1d24;--line:#2a2f3a;--fg:#e7e9ee;--mut:#9aa3b2;
        --acc:#4f8cff;--ok:#2ecc71;--warn:#f1c40f;--bad:#e74c3c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:16px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;
       padding:0 0 60px;-webkit-text-size-adjust:100%}
  header{display:flex;align-items:center;gap:12px;padding:14px 16px;
         border-bottom:1px solid var(--line);background:var(--card);
         position:sticky;top:0;z-index:5}
  .brand{color:var(--acc);font-weight:800;text-decoration:none;font-size:15px}
  h1{font-size:16px;margin:0}
  main{max-width:620px;margin:16px auto;padding:0 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:16px;margin-bottom:14px}
  h2{font-size:14px;margin:0 0 12px;color:var(--fg)}
  label{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px}
  input,select{width:100%;padding:13px 12px;font-size:16px;border-radius:10px;
        border:1px solid var(--line);background:#11141a;color:var(--fg)}
  button{width:100%;padding:15px;font-size:16px;font-weight:700;border:0;
         border-radius:12px;background:var(--acc);color:#fff;cursor:pointer;
         margin-top:14px}
  button.ghost{background:#11141a;border:1px solid var(--line);color:var(--fg)}
  .cv{display:flex;align-items:center;gap:12px;background:#11141a;
      border:1px solid var(--line);border-radius:12px;padding:13px}
  .cv .ico{font-size:26px}
  .cv .info{flex:1;min-width:0}
  .cv .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cv .sub{color:var(--mut);font-size:12px}
  .filebtn{display:block;text-align:center;padding:15px;border-radius:12px;
           border:1px dashed var(--line);color:var(--acc);font-weight:700;
           margin-top:12px;cursor:pointer}
  input[type=file]{display:none}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .chip{padding:9px 14px;border-radius:22px;border:1px solid var(--line);
        background:#11141a;color:var(--mut);font-size:14px;cursor:pointer;
        user-select:none}
  .chip.on{border-color:var(--acc);color:var(--acc);font-weight:700}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;
         background:var(--card);border:1px solid var(--line);border-radius:11px;
         padding:12px 18px;font-size:15px;z-index:30;max-width:92vw;text-align:center}
  .hide{display:none}
  .nav{display:flex;gap:10px;margin-bottom:14px}
  .nav a{flex:1;text-align:center;padding:12px;border-radius:11px;
         background:var(--card);border:1px solid var(--line);color:var(--fg);
         text-decoration:none;font-weight:700;font-size:14px}
</style>
</head>
<body>
<header>
  <a class="brand" href="/assist">← Assist</a>
  <h1>Settings</h1>
</header>
<main>
  <div class="nav">
    <a href="/assist">⚡ Queue</a>
    <a href="/dismissed">🚫 Dismissed</a>
  </div>

  <div class="card">
    <h2>Your CV</h2>
    <div class="cv">
      <div class="ico">📄</div>
      <div class="info">
        <div class="nm" id="cvName">No CV yet</div>
        <div class="sub" id="cvSub">Upload a PDF to start applying</div>
      </div>
    </div>
    <label class="filebtn" for="cvFile" id="cvBtn">⬆︎ Replace CV (PDF)</label>
    <input type="file" id="cvFile" accept="application/pdf,.pdf">
  </div>

  <div class="card">
    <h2>Profile</h2>
    <label>Full name</label><input id="full_name" autocomplete="name">
    <label>Email</label><input id="email" type="email" autocomplete="email">
    <label>Phone</label><input id="phone" type="tel" autocomplete="tel">
    <label>Location</label><input id="location">
    <label>LinkedIn URL</label><input id="linkedin" type="url" inputmode="url">
    <label>GitHub URL</label><input id="github" type="url" inputmode="url">
    <button id="saveProfile">Save profile</button>
  </div>

  <div class="card">
    <h2>Job search</h2>
    <label>Where</label>
    <select id="geography">
      <option value="israel_remote">Israel + remote</option>
      <option value="israel_only">Israel only</option>
      <option value="anywhere">Anywhere</option>
    </select>
    <label>How strict</label>
    <select id="strictness">
      <option value="loose">Loose — more results</option>
      <option value="balanced">Balanced</option>
      <option value="strict">Strict — only clear junior roles</option>
    </select>
    <label>Keep this many applications ready</label>
    <input id="target" type="number" inputmode="numeric" min="10" max="300">
    <label>Job sources</label>
    <div class="chips" id="chips"></div>
    <button id="saveSettings">Save settings</button>
  </div>

  <div class="card">
    <h2>Session</h2>
    <button class="ghost" id="logout">Sign out</button>
  </div>
</main>
<div id="toast" class="toast hide"></div>
<script>
const $ = id => document.getElementById(id);
const CHANNELS = ['greenhouse','lever','ashby','comeet','linkedin'];
let channels = [];

function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hide');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add('hide'),3000);}
async function api(method,url,body){
  const o={method,headers:{}};
  if(body!==undefined){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body);}
  const r=await fetch(url,o);
  if(!r.ok){let m=r.statusText;try{m=(await r.json()).detail||m;}catch{}throw new Error(m);}
  return r.json();
}
function kb(n){return n>=1024*1024?(n/1048576).toFixed(1)+' MB':Math.round(n/1024)+' KB';}

function showCv(p){
  if(!p||!p.cv_path){$('cvName').textContent='No CV yet';
    $('cvSub').textContent='Upload a PDF to start applying';return;}
  $('cvName').textContent=p.cv_name||'cv.pdf';
  $('cvSub').textContent=`${p.cv_pages??'?'} page${p.cv_pages===1?'':'s'} · ${kb(p.cv_size||0)}`;
}

async function load(){
  const p=await api('GET','/api/profile');
  showCv(p);
  for(const k of ['full_name','email','phone','location','linkedin','github'])
    $(k).value=p[k]||'';
  if(!$('location').value) $('location').value='Israel';
  const s=await api('GET','/api/settings');
  $('geography').value=s.geography; $('strictness').value=s.strictness;
  $('target').value=s.target; channels=s.channels||[];
  renderChips();
}
function renderChips(){
  $('chips').innerHTML=CHANNELS.map(c=>
    `<span class="chip ${channels.includes(c)?'on':''}" data-c="${c}">${c}</span>`).join('');
  [...document.querySelectorAll('.chip')].forEach(el=>el.onclick=()=>{
    const c=el.dataset.c;
    channels = channels.includes(c) ? channels.filter(x=>x!==c) : [...channels,c];
    renderChips();
  });
}

// CV upload — works from Android/iOS (file picker, Drive, or a scanned doc).
$('cvFile').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  $('cvBtn').textContent='Uploading…';
  try{
    const fd=new FormData(); fd.append('cv',f);
    const r=await fetch('/api/cv',{method:'POST',body:fd});
    const j=await r.json();
    if(!r.ok) throw new Error(j.detail||'upload failed');
    showCv(j); toast('CV replaced ✓');
  }catch(err){ toast(err.message); }
  $('cvBtn').textContent='⬆︎ Replace CV (PDF)';
  e.target.value='';
};

$('saveProfile').onclick=async()=>{
  try{
    const body={};
    for(const k of ['full_name','email','phone','location','linkedin','github'])
      body[k]=$(k).value;
    await api('PUT','/api/profile',body);
    toast('Profile saved ✓');
  }catch(e){toast(e.message);}
};
$('saveSettings').onclick=async()=>{
  try{
    await api('PUT','/api/settings',{geography:$('geography').value,
      strictness:$('strictness').value,target:$('target').value,channels});
    toast('Settings saved ✓');
  }catch(e){toast(e.message);}
};
$('logout').onclick=async()=>{
  try{ await fetch('/api/logout',{method:'POST'}); location.href='/login'; }
  catch(e){ toast('Sign out failed'); }
};
load();
</script>
</body>
</html>
