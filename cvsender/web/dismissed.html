<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dismissed — CV Sender</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<style>
  :root{--bg:#0f1115;--card:#1a1d24;--line:#2a2f3a;--fg:#e7e9ee;--mut:#9aa3b2;
        --acc:#4f8cff;--ok:#2ecc71;--warn:#f1c40f;--bad:#e74c3c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;
       padding:0 0 40px;-webkit-text-size-adjust:100%}
  header{display:flex;align-items:center;gap:12px;padding:14px 18px;
         border-bottom:1px solid var(--line);background:var(--card);
         position:sticky;top:0;z-index:5}
  .brand{color:var(--acc);font-weight:800;text-decoration:none}
  .count{margin-left:auto;color:var(--mut);font-size:13px}
  main{max-width:820px;margin:18px auto;padding:0 16px}
  .lede{color:var(--mut);font-size:13px;margin:0 0 16px}
  .row{background:var(--card);border:1px solid var(--line);border-radius:12px;
       padding:13px 15px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;
       flex-wrap:wrap}
  .row .main{flex:1;min-width:200px}
  .co{font-weight:700}
  .ti{color:var(--mut);font-size:14px}
  .meta{color:var(--mut);font-size:12px;margin-top:5px}
  .tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;
       font-weight:700;margin-right:6px}
  .perm{background:rgba(231,76,60,.16);color:var(--bad)}
  .temp{background:rgba(241,196,15,.16);color:var(--warn)}
  button{background:#11141a;border:1px solid var(--line);color:var(--fg);
         border-radius:9px;padding:10px 15px;font-weight:700;cursor:pointer}
  button.restore{border-color:rgba(46,204,113,.45);color:var(--ok)}
  a.link{color:var(--acc);font-size:12px}
  .empty{color:var(--mut);text-align:center;padding:50px 0}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;
         background:var(--card);border:1px solid var(--line);border-radius:10px;
         padding:11px 16px;font-size:14px}
  .hide{display:none}
</style>
</head>
<body>
<header>
  <a class="brand" href="/assist">← Assist</a>
  <span style="font-weight:700">Dismissed jobs</span>
  <span class="count" id="count"></span>
</header>
<main>
  <p class="lede">
    Jobs you marked as gone. <b>Same posting</b> (same id or URL) is blocked
    permanently. A <b>text-only</b> match expires, so if the role is genuinely
    reposted later it will come back.
  </p>
  <div id="list"></div>
</main>
<div id="toast" class="toast hide"></div>
<script>
const $ = id => document.getElementById(id);
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hide');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add('hide'),2600);}
function esc(s){return (s??'').toString().replace(/[&<>"]/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function when(ts){ if(!ts) return ''; const d=new Date(ts*1000);
  return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }

async function load() {
  const r = await fetch('/api/dismissed'); const d = await r.json();
  $('count').textContent = d.count ? `${d.count} dismissed` : '';
  if (!d.items.length) { $('list').innerHTML =
    '<div class="empty">Nothing dismissed yet.</div>'; return; }
  $('list').innerHTML = d.items.map(it => `
    <div class="row">
      <div class="main">
        <div class="co">${esc(it.company || it.channel || '')}</div>
        <div class="ti">${esc(it.title || '')}</div>
        <div class="meta">
          ${it.content_block_active
            ? `<span class="tag temp">text match · ${it.content_expires_in_days}d left</span>`
            : ''}
          <span class="tag perm">${esc(it.kind || 'unavailable')}</span>
          ${esc(when(it.at))}
          ${it.note ? ' · ' + esc(it.note) : ''}
          ${it.apply_url ? ` · <a class="link" href="${esc(it.apply_url)}" target="_blank" rel="noopener">open posting ↗</a>` : ''}
        </div>
      </div>
      <button class="restore" onclick="restore('${esc(it.dedupe_key)}')">↩︎ Restore</button>
    </div>`).join('');
}
async function restore(key) {
  const r = await fetch('/api/dismissed/restore', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({dedupe_key: key})});
  if (!r.ok) { toast('Restore failed'); return; }
  toast('Restored — it can be offered again');
  load();
}
window.restore = restore;
load();
</script>
</body>
</html>
