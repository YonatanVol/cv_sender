<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>System — CV Sender</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="stylesheet" href="/static/shared.css">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  .big { display: flex; align-items: center; gap: 13px; }
  .big .dot { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; background: var(--dim); }
  .big .dot.ok { background: var(--ok); box-shadow: 0 0 0 4px var(--ok-soft); }
  .big .dot.warn { background: var(--warn); box-shadow: 0 0 0 4px var(--warn-soft); }
  .big .dot.fail { background: var(--bad); box-shadow: 0 0 0 4px var(--bad-soft); }
  .big h1 { font-size: 18px; font-weight: 700; }
  .check { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line-soft); }
  .check:first-child { border-top: 0; padding-top: 2px; }
  .check .mark { flex: 0 0 18px; font-weight: 800; font-size: 14px; text-align: center; line-height: 1.5; }
  .mark.ok { color: var(--ok); } .mark.warn { color: var(--warn); } .mark.fail { color: var(--bad); }
  .check .name { font-weight: 600; }
  .check .detail { color: var(--mut); font-size: 12.5px; margin-top: 3px; }
  .fix {
    margin-top: 7px; font-size: 12px; background: var(--well); color: var(--acc);
    border: 1px solid var(--line-soft); border-radius: 8px; padding: 8px 10px;
    font-family: ui-monospace, Menlo, monospace; word-break: break-all;
  }
</style>
</head>
<body>
<header id="hdr"></header>
<main>
  <section class="card">
    <div class="big"><span class="dot" id="dot"></span>
      <div><h1 id="stateText">Checking…</h1>
        <div class="sub" id="stateSub">&nbsp;</div></div></div>
    <div class="row" style="margin-top:16px">
      <button id="runNow">Search now</button>
      <button class="ghost" id="recheck">Re-check</button>
      <a class="btn ghost" href="/today">Today</a>
    </div>
  </section>

  <section class="card">
    <h2>The queue</h2>
    <div class="tiles" id="queue"></div>
  </section>

  <section class="card">
    <h2>Components</h2>
    <div id="checks"><div class="skeleton" style="height:48px"></div></div>
  </section>

  <section class="card">
    <h2>Job boards</h2>
    <div id="sources" class="sub">Loading…</div>
  </section>

  <section class="card">
    <h2>Scheduler</h2>
    <div id="sched"></div>
  </section>
</main>
<div id="toast" class="toast hide"></div>
<script src="/static/shared.js"></script>
<script>
$('hdr').innerHTML = navBar('/status');
const MARK = { ok: '✓', warn: '!', fail: '✗' };

function render(h) {
  $('dot').className = 'dot ' + h.state;
  $('stateText').textContent = h.state === 'ok' ? 'Everything is working'
    : h.state === 'warn' ? 'Working, with warnings' : 'Something is broken';
  const bad = h.checks.filter(c => c.state !== 'ok');
  $('stateSub').textContent = bad.length
    ? bad.map(c => c.check).join(', ') + ' need attention'
    : `All ${h.checks.length} checks passed`;

  const q = h.queue || {};
  $('queue').innerHTML = [
    ['Waiting', q.total], ['Fresh this week', q.fresh_7d],
    ['Within a month', q.stale_14d], ['Older', q.old_30d],
    ['Unverified', q.unverified_old],
  ].map(([label, n]) => `<div class="tile"><b>${n ?? '–'}</b><span>${label}</span></div>`).join('');

  $('checks').innerHTML = h.checks.map(c => `
    <div class="check">
      <div class="mark ${c.state}">${MARK[c.state]}</div>
      <div><div class="name">${esc(c.check)}</div>
        <div class="detail">${esc(c.detail || '')}</div>
        ${c.fix && c.state !== 'ok' ? `<div class="fix">${esc(c.fix)}</div>` : ''}</div>
    </div>`).join('');

  $('sources').innerHTML = (h.sources && h.sources.length)
    ? h.sources.map(s => `<div class="stat">
         <span><span class="mark ${s.state}">${MARK[s.state]}</span> ${esc(s.source)}</span>
         <span class="sub num">${s.jobs} jobs · ${esc(String(s.status))}</span></div>`).join('')
    : 'No board results yet — they are recorded on the next search.';

  const s = h.scheduler || {};
  $('sched').innerHTML = [
    ['Running', s.running ? 'yes' : 'no'],
    ['Last beat', s.last_tick_age_s != null ? s.last_tick_age_s + 's ago' : 'never'],
    ['Next search', s.next_staging_at],
    ['Last search', s.last_staging_result || 'not yet today'],
    ['Last freshness check', s.last_verify || 'none yet'],
    ['Target queue size', s.target_depth],
    ['Boards searched', (s.channels || []).join(', ')],
  ].map(([k, v]) => `<div class="stat"><span>${k}</span>
      <span class="sub num">${esc(String(v ?? '–'))}</span></div>`).join('');
}

async function load() {
  try { render(await api('GET', '/api/health')); }
  catch (e) { $('stateText').textContent = 'Could not load: ' + e.message; }
}
$('recheck').onclick = load;
$('runNow').onclick = async () => {
  $('runNow').disabled = true;
  try {
    const r = await api('POST', '/api/run-now');
    toast(r.run_id ? `Search started (run #${r.run_id})` : (r.detail || 'Nothing to search for'));
  } catch (e) { toast(e.message); }
  $('runNow').disabled = false; load();
};
load();
setInterval(load, 30000);
</script>
</body>
</html>
